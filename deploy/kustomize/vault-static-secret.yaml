# Placeholder: syncs the Infoblox Portal API key from Vault KV into the
# `uddi-api-key` Secret the webhook sidecar reads (key `api_key`).
#
# The real deployment is expected to live in your GitOps repo, which also
# owns the Vault path/role; `uddi/default/api-key` and `external-dns` below
# are example names, not a contract. The key itself must be a least-privilege
# Portal API key: DNS data read/write scoped to the target view only.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uddi-api-key
spec:
  vaultAuthRef: vault-auth        # VaultAuth in this namespace (example; your GitOps repo decides)
  mount: kv                       # KV v2 mount (example; your GitOps repo decides)
  type: kv-v2
  path: uddi/default/api-key      # expected keys: api_key
  refreshAfter: 1h
  destination:
    name: uddi-api-key
    create: true
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: external-dns
