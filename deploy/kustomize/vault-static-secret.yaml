# This example syncs the Infoblox Portal API key from Vault KV to the
# `uddi-api-key` Secret used by the webhook.
#
# Define the real Vault path and role in your GitOps repository. The names below
# are examples. Restrict the Portal API key to DNS data in the target view.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uddi-api-key
spec:
  vaultAuthRef: vault-auth        # VaultAuth in this namespace (example; your GitOps repo decides)
  mount: kv                       # KV v2 mount (example; your GitOps repo decides)
  type: kv-v2
  path: uddi/default/api-key      # expected keys: api_key
  refreshAfter: 1h
  destination:
    name: uddi-api-key
    create: true
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: external-dns
