# Placeholder: syncs the Infoblox Portal API key from Vault KV into the
# `uddi-api-key` Secret the webhook sidecar reads (key `api_key`).
#
# The KV mount/path and the Vault role are DECIDED IN THE IAC REPO (Vault is
# configured from there); `uddi/default/api-key` and `external-dns` below are
# the proposed names, not a contract. The key itself must be a least-privilege
# Portal API key: DNS data read/write scoped to the `wayvz-internal` view only.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uddi-api-key
spec:
  vaultAuthRef: vault-auth        # VaultAuth in this namespace (iac decides)
  mount: kv                       # KV v2 mount (iac decides)
  type: kv-v2
  path: uddi/default/api-key      # expected keys: api_key
  refreshAfter: 1h
  destination:
    name: uddi-api-key
    create: true
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: external-dns
