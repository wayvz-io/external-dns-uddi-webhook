# This example is not applied from this repository. Keep the deployment in your
# GitOps repository, such as a HelmRelease of the upstream ExternalDNS chart.
# README.md contains the chart values. These manifests show the equivalent
# sidecar, environment, RBAC, and Vault configuration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - namespace.yaml
  - rbac.yaml
  - vault-static-secret.yaml
  - deployment.yaml

images:
  - name: registry.k8s.io/external-dns/external-dns
    newTag: v0.22.0
  - name: ghcr.io/wayvz-io/external-dns-uddi-webhook
    newTag: latest
