# This example expects an `uddi-api-key` Secret in the external-dns namespace.
# Create that Secret with the secret manager used by your environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml

images:
  - name: registry.k8s.io/external-dns/external-dns
    newTag: v0.22.0
  - name: ghcr.io/wayvz-io/external-dns-uddi-webhook
    newTag: latest
