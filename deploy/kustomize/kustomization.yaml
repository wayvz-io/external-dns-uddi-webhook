# EXAMPLE ONLY -- not applied from this repo. The real deployment is expected
# to live in your GitOps repo, e.g. as a HelmRelease of the upstream
# external-dns chart with `provider.name: webhook`; see README.md for the values
# snippet. This kustomization shows the equivalent raw manifests so the wiring
# (sidecar, env, RBAC, Vault secret) is reviewable in one place.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-dns

resources:
  - namespace.yaml
  - rbac.yaml
  - vault-static-secret.yaml
  - deployment.yaml

images:
  - name: registry.k8s.io/external-dns/external-dns
    newTag: v0.22.0
  - name: ghcr.io/wayvz-io/external-dns-uddi-webhook
    newTag: latest
