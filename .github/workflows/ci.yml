name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bb-ci-worker ARC runner submits remote actions to the lab Buildbarn
  # cluster. It has Bazel 9.1.1 and bb-clientd installed. The runner reaches
  # Buildbarn through Kubernetes Service DNS and plain gRPC. The infrastructure
  # repository defines the runner and endpoints.
  #
  # The branch ruleset requires this job, so keep its name stable.
  rbe:
    name: Test (RBE)
    # Do not let pull requests from forks schedule the self-hosted runner.
    # GitHub also requires approval for outside collaborators.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: bb-ci-worker
    # Release the single runner slot if a job stalls.
    timeout-minutes: 30
    env:
      BES_BACKEND: grpc://bb-portal.buildbarn:8082
      # Bazel prints this URL for the invocation results.
      BES_RESULTS_URL: https://bb-portal.lab.wayvz.io/bazel-invocations/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Coverage build + test on RBE (via bb-clientd)
        # The runner starts bb-clientd as a local cache backed by a persistent
        # volume. The Bazel output root and repository cache use the same volume.
        # `bazel coverage` builds the project, runs every test, and emits native
        # Go profiles. The merge script combines those profiles for Sonar.
        # Retry once on the same runner to retain the cached output.
        run: |
          run_coverage() {
            bazel --output_user_root=/clientd/bazel coverage --config=remote \
              --remote_executor=unix:///clientd/bb_clientd/grpc \
              --remote_cache=unix:///clientd/bb_clientd/grpc \
              --remote_instance_name=frontend.buildbarn \
              --repository_cache=/clientd/bazel-repo-cache \
              --bes_backend="$BES_BACKEND" \
              --bes_results_url="$BES_RESULTS_URL" \
              //...
          }
          run_coverage || {
            echo "::warning::RBE coverage run failed; retrying once on the same runner (warm cache)."
            run_coverage
          }

      - name: Merge Go coverprofiles
        run: |
          testlogs="$(bazel --output_user_root=/clientd/bazel info bazel-testlogs)"
          scripts/merge-go-coverage.sh "$testlogs" target/sonar/go-coverage.out

      - name: Verify Go coverage report is non-empty
        # Reject an empty artifact because Sonar would otherwise report zero coverage.
        run: |
          if [ ! -s target/sonar/go-coverage.out ] || [ "$(wc -l < target/sonar/go-coverage.out)" -lt 2 ]; then
            echo "::error::target/sonar/go-coverage.out is empty; bazel coverage produced nothing."
            exit 1
          fi
          echo "go-coverage.out: $(tail -n +2 target/sonar/go-coverage.out | cut -d: -f1 | sort -u | wc -l) source files, $(($(wc -l < target/sonar/go-coverage.out) - 1)) block records"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: target/sonar/go-coverage.out
          retention-days: 3
          if-no-files-found: error

  sonar-scan:
    name: sonar scan
    # Sonar tracks main, so pull requests build coverage without running a scan.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: rbe
    # bb-ci-worker has Bazel and mounts the CA bundle required by Vault.
    runs-on: bb-ci-worker
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC JWT for the Vault login
    env:
      # The Vault certificate covers this FQDN, not the short service name.
      VAULT_ADDR: https://vault-active.vault.svc.cluster.local:8200
      # Node uses this CA bundle for the Vault connection.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      # Use the in-cluster SonarQube service.
      SONAR_HOST_URL: http://sonarqube.sonarqube.svc.cluster.local:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history for blame and new-code detection.
          fetch-depth: 0

      # Exchange the GitHub OIDC token for a 15-minute Vault token. The role is
      # restricted to this workflow on main and can read only the SonarQube token.
      - name: Read SonarQube token from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: github-actions
          role: external-dns-uddi-webhook-ci
          jwtGithubAudience: https://github.com/wayvz-io
          secrets: |
            kv/data/sonarqube/default/user-token token | SONAR_TOKEN

      - name: Download Go coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage
          path: target/sonar          # -> target/sonar/go-coverage.out

      - name: Verify Go coverage report present
        run: |
          if [ ! -s target/sonar/go-coverage.out ]; then
            echo "::error::target/sonar/go-coverage.out is missing after download; refusing to scan."
            exit 1
          fi

      - name: Sonar scan
        # Run the pinned scanner locally against the source and coverage report.
        run: |
          bazel --output_user_root=/clientd/bazel run --config=local \
            --repository_cache=/clientd/bazel-repo-cache \
            //tools/sonar:scan
