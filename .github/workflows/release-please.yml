name: release-please

# Conventional commits on main -> release-please maintains a release PR
# (CHANGELOG + version bump). Merging that PR creates the `vX.Y.Z` tag and the
# GitHub release stub, and the tag triggers release.yml (image push).
#
# The GitHub App token pushes the tag because events created with GITHUB_TOKEN
# do not start other workflows. The app ID and private key are organization
# secrets granted to this repository.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOUPDATE_APP_ID }}
          private-key: ${{ secrets.AUTOUPDATE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
