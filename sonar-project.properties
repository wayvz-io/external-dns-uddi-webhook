# SonarQube project config. Analysis runs via scripts/sonar-scan.sh locally and
# the `sonar scan` job in .github/workflows/ci.yml (post-merge on main), both
# through the hermetic scanner in //tools/sonar:scan. No token here -- creds are
# resolved at run time (env in CI, 1Password locally). projectKey MUST match the
# project key on the server (https://sonarqube.lab.wayvz.io).
sonar.projectKey=external-dns-uddi-webhook
sonar.projectName=ExternalDNS UDDI webhook
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# What NOT to scan: Bazel symlinks/outputs, local env dirs, agent worktrees,
# docs, and the example kustomize manifests (not code we analyze).
sonar.exclusions=bazel-*/**,**/bazel-out/**,target/**,.direnv/**,.claude/**,.git/**,.jj/**,docs/**,deploy/**,**/testdata/**,result/**

# Go: test fixtures are not analyzable source.
sonar.go.exclusions=**/testdata/**,**/vendor/**

# Go line coverage: ONE merged native coverprofile (`go test -coverprofile`
# format), produced from `bazel coverage //...` (cover_format=go_cover) by
# scripts/merge-go-coverage.sh.
sonar.go.coverage.reportPaths=target/sonar/go-coverage.out
