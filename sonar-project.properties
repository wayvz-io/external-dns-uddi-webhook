# scripts/sonar-scan.sh and the CI sonar job both run //tools/sonar:scan.
# CI reads credentials from the environment. Local runs can use 1Password.
# sonar.projectKey must match the project on the SonarQube server.
sonar.projectKey=external-dns-uddi-webhook
sonar.projectName=ExternalDNS UDDI webhook
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Exclude generated files, local environments, docs, and deployment examples.
sonar.exclusions=bazel-*/**,**/bazel-out/**,target/**,.direnv/**,.claude/**,.git/**,.jj/**,docs/**,deploy/**,**/testdata/**,result/**

# Go: test fixtures are not analyzable source.
sonar.go.exclusions=**/testdata/**,**/vendor/**

# Go line coverage: ONE merged native coverprofile (`go test -coverprofile`
# format), produced from `bazel coverage //...` (cover_format=go_cover) by
# scripts/merge-go-coverage.sh.
sonar.go.coverage.reportPaths=target/sonar/go-coverage.out
